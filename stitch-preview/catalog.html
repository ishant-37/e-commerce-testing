<script>
        // Simple micro-interaction for fav buttons
        document.querySelectorAll('.material-symbols-outlined:contains("favorite")').forEach(btn => {
            btn.parentElement.addEventListener('click', function(e) {
                e.preventDefault();
                const icon = this.querySelector('span');
                if(icon.classList.contains('icon-fill')) {
                    icon.classList.remove('icon-fill', 'text-error');
                    icon.classList.add('text-on-surface-variant');
                } else {
                    icon.classList.add('icon-fill', 'text-error');
                    icon.classList.remove('text-on-surface-variant');
                }
                
                // Pop animation
                this.style.transform = 'scale(1.2)';
                setTimeout(() => {
                    this.style.transform = 'scale(1)';
                }, 150);
            });
        });
        
        // Polyfill for contains selector logic above
        document.querySelectorAll('.material-symbols-outlined').forEach(span => {
            if (span.textContent.trim() === 'favorite') {
                 span.parentElement.addEventListener('click', function(e) {
                    e.preventDefault();
                    if(span.classList.contains('icon-fill')) {
                        span.classList.remove('icon-fill', 'text-error');
                        span.classList.add('text-on-surface-variant');
                    } else {
                        span.classList.add('icon-fill', 'text-error');
                        span.classList.remove('text-on-surface-variant');
                    }
                    this.style.transform = 'scale(1.2)';
                    setTimeout(() => {
                        this.style.transform = 'scale(1)';
                    }, 150);
                 });
            }
        });
    </script>
