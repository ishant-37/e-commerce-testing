{% extends "base.html" %}
{% block title %}Login{% endblock %}

{% block content %}
<div class="auth-container">
    <div class="auth-card">
        <h1 class="auth-title">Welcome Back</h1>
        <p class="auth-subtitle">Log in to your ShopQA account</p>

        <form id="login-form" onsubmit="handleLogin(event)">
            <div class="form-group">
                <label for="email" class="form-label">Email Address</label>
                <input type="email" id="email" name="email" class="form-input" placeholder="Enter your email" required>
                <span class="form-error" id="email-error"></span>
            </div>

            <div class="form-group">
                <label for="password" class="form-label">Password</label>
                <input type="password" id="password" name="password" class="form-input" placeholder="Enter your password" required>
                <span class="form-error" id="password-error"></span>
            </div>

            <button type="submit" class="btn btn-primary btn-block" id="btn-login">Login</button>
        </form>

        <p class="auth-footer">
            Don't have an account? <a href="{{ url_for('auth.register_page') }}" id="link-register">Register here</a>
        </p>
    </div>
</div>
{% endblock %}

{% block scripts %}
<script>
async function handleLogin(event) {
    event.preventDefault();
    clearErrors();

    const email = document.getElementById('email').value.trim();
    const password = document.getElementById('password').value;

    // Client-side validation
    let hasError = false;

    if (!email) {
        showFieldError('email', 'Email is required');
        hasError = true;
    }
    if (!password) {
        showFieldError('password', 'Password is required');
        hasError = true;
    }

    if (hasError) return;

    try {
        const response = await fetch('/api/login', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ email, password })
        });

        const data = await response.json();

        if (response.ok) {
            showAlert('Login successful! Redirecting...', 'success');
            setTimeout(() => window.location.href = '/products', 1000);
        } else {
            const errorMsg = Array.isArray(data.error) ? data.error.join(', ') : data.error;
            showAlert(errorMsg, 'error');
        }
    } catch (error) {
        showAlert('Network error. Please try again.', 'error');
    }
}
</script>
{% endblock %}
