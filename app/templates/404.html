{% extends "base.html" %}
{% block title %}Not Found{% endblock %}

{% block content %}
<div class="container">
    <div class="empty-state" id="not-found">
        <div class="empty-icon">404</div>
        <h3>{{ message or 'Page Not Found' }}</h3>
        <p>The page you're looking for doesn't exist or has been moved.</p>
        <a href="{{ url_for('products.products_page') }}" class="btn btn-primary">Go to Products</a>
    </div>
</div>
{% endblock %}
