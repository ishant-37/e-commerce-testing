{% extends "base.html" %}
{% block title %}Register{% endblock %}

{% block content %}
<div class="auth-container">
    <div class="auth-card">
        <h1 class="auth-title">Create Account</h1>
        <p class="auth-subtitle">Join ShopQA to start shopping</p>

        <form id="register-form" onsubmit="handleRegister(event)">
            <div class="form-group">
                <label for="name" class="form-label">Full Name</label>
                <input type="text" id="name" name="name" class="form-input" placeholder="Enter your full name" required>
                <span class="form-error" id="name-error"></span>
            </div>

            <div class="form-group">
                <label for="email" class="form-label">Email Address</label>
                <input type="email" id="email" name="email" class="form-input" placeholder="Enter your email" required>
                <span class="form-error" id="email-error"></span>
            </div>

            <div class="form-group">
                <label for="password" class="form-label">Password</label>
                <input type="password" id="password" name="password" class="form-input" placeholder="Minimum 6 characters" required minlength="6">
                <span class="form-error" id="password-error"></span>
            </div>

            <div class="form-group">
                <label for="confirm-password" class="form-label">Confirm Password</label>
                <input type="password" id="confirm-password" name="confirm_password" class="form-input" placeholder="Re-enter your password" required>
                <span class="form-error" id="confirm-password-error"></span>
            </div>

            <button type="submit" class="btn btn-primary btn-block" id="btn-register">Register</button>
        </form>

        <p class="auth-footer">
            Already have an account? <a href="{{ url_for('auth.login_page') }}" id="link-login">Login here</a>
        </p>
    </div>
</div>
{% endblock %}

{% block scripts %}
<script>
async function handleRegister(event) {
    event.preventDefault();
    clearErrors();

    const name = document.getElementById('name').value.trim();
    const email = document.getElementById('email').value.trim();
    const password = document.getElementById('password').value;
    const confirmPassword = document.getElementById('confirm-password').value;

    // Client-side validation
    let hasError = false;

    if (!name) {
        showFieldError('name', 'Name is required');
        hasError = true;
    }
    if (!email) {
        showFieldError('email', 'Email is required');
        hasError = true;
    }
    if (!password) {
        showFieldError('password', 'Password is required');
        hasError = true;
    } else if (password.length < 6) {
        showFieldError('password', 'Password must be at least 6 characters');
        hasError = true;
    }
    if (password !== confirmPassword) {
        showFieldError('confirm-password', 'Passwords do not match');
        hasError = true;
    }

    if (hasError) return;

    try {
        const response = await fetch('/api/register', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ name, email, password })
        });

        const data = await response.json();

        if (response.ok) {
            showAlert('Registration successful! Redirecting to login...', 'success');
            setTimeout(() => window.location.href = '/login', 1500);
        } else {
            const errorMsg = Array.isArray(data.error) ? data.error.join(', ') : data.error;
            showAlert(errorMsg, 'error');
        }
    } catch (error) {
        showAlert('Network error. Please try again.', 'error');
    }
}
</script>
{% endblock %}
