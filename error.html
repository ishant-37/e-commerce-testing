<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="E-Commerce QA Project — A portfolio project demonstrating QA testing skills">
    <title>Login | E-Commerce QA Project</title>
    <link rel="stylesheet" href="/static/css/style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <!-- Navigation Bar -->
    <nav class="navbar" id="main-navbar">
        <div class="nav-container">
            <a href="/products" class="nav-logo" id="nav-logo">
                <span class="logo-icon">🛒</span> ShopQA
            </a>

            <div class="nav-links">
                <a href="/products" class="nav-link" id="nav-products">Products</a>

                
                    <a href="/login" class="nav-link" id="nav-login">Login</a>
                    <a href="/register" class="btn btn-primary btn-sm" id="nav-register">Register</a>
                
            </div>

            <!-- Mobile menu toggle -->
            <button class="nav-toggle" id="nav-toggle" onclick="toggleMobileMenu()">☰</button>
        </div>

        <!-- Mobile menu -->
        <div class="nav-mobile" id="nav-mobile">
            <a href="/products" class="nav-link">Products</a>
            
                <a href="/login" class="nav-link">Login</a>
                <a href="/register" class="btn btn-primary btn-sm">Register</a>
            
        </div>
    </nav>

    <!-- Flash Messages -->
    
        
    

    <!-- Alert container for JS messages -->
    <div id="alert-container" class="flash-container"></div>

    <!-- Main Content -->
    <main class="main-content">
        
<div class="auth-container">
    <div class="auth-card">
        <h1 class="auth-title">Welcome Back</h1>
        <p class="auth-subtitle">Log in to your ShopQA account</p>

        <form id="login-form" onsubmit="handleLogin(event)">
            <div class="form-group">
                <label for="email" class="form-label">Email Address</label>
                <input type="email" id="email" name="email" class="form-input" placeholder="Enter your email" required>
                <span class="form-error" id="email-error"></span>
            </div>

            <div class="form-group">
                <label for="password" class="form-label">Password</label>
                <input type="password" id="password" name="password" class="form-input" placeholder="Enter your password" required>
                <span class="form-error" id="password-error"></span>
            </div>

            <button type="submit" class="btn btn-primary btn-block" id="btn-login">Login</button>
        </form>

        <p class="auth-footer">
            Don't have an account? <a href="/register" id="link-register">Register here</a>
        </p>
    </div>
</div>

    </main>

    <!-- Footer -->
    <footer class="footer">
        <div class="footer-container">
            <p>&copy; 2026 ShopQA — E-Commerce QA Testing Project</p>
            <p class="footer-note">Portfolio project for QA Engineer demonstration</p>
        </div>
    </footer>

    <script src="/static/js/main.js"></script>
    
<script>
async function handleLogin(event) {
    event.preventDefault();
    clearErrors();

    const email = document.getElementById('email').value.trim();
    const password = document.getElementById('password').value;

    // Client-side validation
    let hasError = false;

    if (!email) {
        showFieldError('email', 'Email is required');
        hasError = true;
    }
    if (!password) {
        showFieldError('password', 'Password is required');
        hasError = true;
    }

    if (hasError) return;

    try {
        const response = await fetch('/api/login', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ email, password })
        });

        const data = await response.json();

        if (response.ok) {
            showAlert('Login successful! Redirecting...', 'success');
            setTimeout(() => window.location.href = '/products', 1000);
        } else {
            const errorMsg = Array.isArray(data.error) ? data.error.join(', ') : data.error;
            showAlert(errorMsg, 'error');
        }
    } catch (error) {
        showAlert('Network error. Please try again.', 'error');
    }
}
</script>

</body>
</html>
